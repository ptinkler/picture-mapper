{% extends "base.html" %}
{% block content %}
<h1>Pictures from all over the world</h1>
<p>Upload your pictures with the place they were taken and see everyone's on one map.</p>
{% if user.is_authenticated %}
  <p><a class="button" href="{% url 'map' %}">Open the map</a> <a class="button" href="{% url 'upload_picture' %}">Upload a picture</a></p>
{% else %}
  <p><a class="button" href="{% url 'signup' %}">Sign up</a> <a class="button" href="{% url 'login' %}">Log in</a></p>
{% endif %}
{% endblock %}
