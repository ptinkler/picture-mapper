name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen --python ${{ matrix.python }}
      - run: uv run --frozen pytest
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - name: No model change without a migration
        env:
          DJANGO_DEBUG: "1"
        run: uv run --frozen python manage.py makemigrations --check --dry-run
      - name: Deployment checks
        env:
          DJANGO_SECRET_KEY: ${{ github.sha }}${{ github.sha }}${{ github.sha }}
          DJANGO_ALLOWED_HOSTS: example.com
        run: uv run --frozen python manage.py check --deploy --fail-level WARNING

  # One stable check name to require in branch protection, whatever the Python matrix is.
  check:
    if: always()
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Every Python version passed
        run: test "${{ needs.test.result }}" = "success"
